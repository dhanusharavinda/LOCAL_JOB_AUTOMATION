# Railway deployment config (Nixpacks)
# Deploys the Express server from the monorepo root so the pipeline
# subprocess (spawned via tsx) can resolve ../pipeline at runtime.

[phases.setup]
# Puppeteer needs Chromium system libraries. Railway uses Debian-based
# images, so these apt packages cover the full dependency tree.
aptPkgs = [
  "chromium",
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libpango-1.0-0",
  "libcairo2",
  "libasound2",
  "libnspr4",
  "libxss1",
  "fonts-liberation",
]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build --workspace=server"]

[start]
cmd = "node server/dist/index.js"
